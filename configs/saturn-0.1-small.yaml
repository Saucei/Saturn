# =============================================================================
# Saturn 0.1 — Model Configuration
# Target: ~100M parameters, fits 4GB VRAM via layer-streaming, runs on 16GB RAM
# Math/code-only output (no natural language prose)
# =============================================================================

model = dict(
    name="saturn-0.1-small",
    # Architecture
    n_layers=8,
    n_heads=8,
    n_kv_heads=2,          # Grouped-query attention (fewer KV heads = smaller cache)
    d_model=512,
    d_ff=1365,             # SwiGLU intermediate: 2/4 * d_model rounded
    vocab_size=8192,       # Math/code tokens only (LaTeX, Lean, Python, symbols)
    context_len=2048,
    # Attention: Multi-head Latent Attention (DeepSeek style) for KV compression
    use_mla=True,
    mla_kv_rank=64,        # Low-rank KV compression
    # Normalization
    norm_eps=1e-5,
    # Precision
    dtype="fp16",          # GPU compute
    master_dtype="fp32",   # System RAM master weights
    # Output constraint
    math_only_output=True, # Constrained decoding mask at inference
)

training = dict(
    # Unified heterogeneous training
    device_strategy="cpu_ram_gpu_stream",  # Master in RAM, compute window on GPU
    batch_size=4,
    gradient_accumulation_steps=16,        # Effective batch 64, reduces PCIe overhead
    learning_rate=3e-4,
    min_lr=3e-5,
    lr_decay="cosine",
    warmup_steps=500,
    max_steps=50000,
    weight_decay=0.01,
    beta1=0.9,
    beta2=0.95,
    eps=1e-8,
    grad_clip=1.0,
    # Mixed precision
    fp16_gpu=True,
    fp32_master=True,
    # Checkpointing
    save_every=5000,
    eval_every=1000,
    keep_last_n=3,
)

data = dict(
    # Math-only corpus sources
    sources=[
        "arxiv_math_latex",      # arXiv mathematics LaTeX source
        "lean4_mathlib",         # Lean 4 formal proofs (no natural language)
        "codeforces_solutions",  # Competitive programming code
        "project_euler",         # Math + code
        "wikibooks_math",        # Textbook math (strip prose, keep equations)
        "stackexchange_math",    # Q&A (filter to derivations only)
    ],
    tokenizer="bpe_math",        # Custom BPE on math tokens
    vocab_target=8192,
    seq_len=2048,
    # Memory mapping: dataset too big for RAM? mmap handles it
    use_mmap=True,
    mmap_path="/saturn/data/tokenized/math_corpus.bin",
    # Preprocessing
    strip_natural_language=True, # Remove English prose from targets
    min_tokens_per_sample=16,
    max_tokens_per_sample=2048,
)

hardware = dict(
    cpu_cores=4,
    cpu_threads=8,
    system_ram_gb=16,
    gpu_vram_gb=4,
    gpu_name="Quadro M1200",
    cuda_capability="5.0",       # Maxwell — no BF16, FP16 only
    pcie_gen=3,
    disk_read_mbs=50,            # Expect slower on HDD; use RAM/mmap heavily
)
